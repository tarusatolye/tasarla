name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Birim testleri
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kalıp derlenir, sürüm dosyası ve statik yollar doğrulanır
        run: |
          docker build -t tasarla --build-arg SOURCE_COMMIT=${{ github.sha }} .
          docker run -d --rm -p 8080:80 -p 8022:2022 --name tasarla tasarla
          sleep 2
          curl -fsS localhost:8080/version.json | tee /dev/stderr | grep -q '"app":"tasarla"'
          curl -fsS localhost:8080/ | grep -q '<title>tarus Tasarla</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/js/yok.js)" = 404
          curl -fsS -o /dev/null localhost:8080/js/kabuk.js
          curl -fsS localhost:8022/version.json | grep -q '"app":"tasarla"'
          docker stop tasarla
