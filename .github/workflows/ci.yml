name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions dakikası (2026-10-04): aynı PR'a yeni commit gelince eski çalışma
# iptal edilir; PR birleştirme commit'i PR'da sınandığı için main'de işler
# atlanır (doğrudan main push'u yine sınanır).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Birim testleri
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler
        run: npm run test:e2e

  docker:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kalıp derlenir, sürüm dosyası ve statik yollar doğrulanır
        run: |
          docker build -t tasarla --build-arg SOURCE_COMMIT=${{ github.sha }} .
          docker run -d --rm -p 8080:80 --name tasarla tasarla
          sleep 2
          curl -fsS localhost:8080/version.json | tee /dev/stderr | grep -q '"app":"tasarla"'
          curl -fsS localhost:8080/ | grep -q '<title>tarus Tasarla</title>'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/js/yok.js)" = 404
          curl -fsS -o /dev/null localhost:8080/js/kabuk.js
          docker stop tasarla

  api:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt
      - name: API testleri (galeri) ve eksik migration denetimi
        env:
          DJANGO_DEBUG: '1'
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test galeri
