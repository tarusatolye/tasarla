# Coolify: "Docker Compose" kaynağı (docs/RUNBOOK-yayin.md → 2b). Alan adı (tasarla.tarus.tr)
# yalnız `web`e verilir; `tasarla-api` dışarı açılmaz, web ona bu adla ulaşır.
# Servis adı Tasarla'ya özgü: Coolify servisleri ortak «coolify» ağına da bağlar, «api» gibi
# genel bir ad başka uygulamanın servisine çözülür (yonetim'in api'si, 2026-10-06).
services:
  web:
    build:
      context: .
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-yerel}
    restart: unless-stopped
    depends_on:
      - tasarla-api
    volumes:
      - medya:/srv/medya:ro
    expose:
      - "80"

  tasarla-api:
    build: ./api
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-tasarla.tarus.tr}
      # Boş bırakılırsa SQLite (veri birimi); PostgreSQL için postgres://…
      DATABASE_URL: ${DATABASE_URL:-}
      TASARLA_MODERASYON_TOKEN: ${TASARLA_MODERASYON_TOKEN:-}
      # Silme/gizleme yalnız yönetici: Pusula oturumundaki rol bu listedeyse (galeri/yonetici.py)
      TASARLA_YONETICI_ROLLERI: ${TASARLA_YONETICI_ROLLERI:-SUPERADMIN}
      PUSULA_URL: ${PUSULA_URL:-https://pusula.tarus.tr}
      # Bağlantı önizlemesi (Open Graph) mutlak adresleri (api/galeri/meta.py)
      TASARLA_SITE_URL: ${TASARLA_SITE_URL:-https://tasarla.tarus.tr}
      TASARLA_SIKAYET_ESIGI: ${TASARLA_SIKAYET_ESIGI:-3}
      TASARLA_KAYIT_SINIRI: ${TASARLA_KAYIT_SINIRI:-30/hour}
    volumes:
      - medya:/app/medya
      - veri:/app/veri
    # Coolify'daki ayrı PostgreSQL kaynağı sunucunun "coolify" ağında; api ona bu ağdan ulaşır.
    networks:
      - default
      - coolify
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/saglik/', headers={'Host': 'tasarla.tarus.tr'}))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  medya:
  veri:

networks:
  coolify:
    external: true
