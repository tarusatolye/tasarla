# tasarla.tarus.tr — statik dosyalar + /api/ (tasarım kaydetme ve galeri, api/ Django servisi).
# Pusula'ya istekler tarayıcıdan gider (CORS: pusula Backend settings EKOSISTEM_ORIGINS).

# Ziyaretçi IP'si: Cloudflare varsa CF-Connecting-IP, yoksa Traefik'in X-Real-IP'si.
# Django'ya tek değerli X-Forwarded-For olarak gider (DRF NUM_PROXIES=1): hız sınırı ve
# tekil beğeni bununla sayılır (IP saklanmaz, anahtarlı özeti tutulur).
map $http_x_real_ip $traefik_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}
map $http_cf_connecting_ip $istemci_ip {
    ""      $traefik_ip;
    default $http_cf_connecting_ip;
}
# Özgün şema: HTTPS Cloudflare'de biter; CF-Visitor ziyaretçinin gerçek şemasını söyler.
map $http_x_forwarded_proto $iletilen_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}
map $http_cf_visitor $ozgun_proto {
    "~\"scheme\":\"https\"" https;
    default                 $iletilen_proto;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # tasarla-api adı açılışta değil istek anında çözülür: api yoksa (yalnız Dockerfile yayını) ya da
    # yeniden başlıyorsa nginx kapanmaz, yalnız /api/ 502 döner; arayüz paylaşımı gizler.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    # Ad Tasarla'ya özgü olmalı: Coolify bütün compose servislerini ortak «coolify» ağına da bağlar;
    # «api» adı orada yonetim'in api servisine çözülüyordu (2026-10-06, istekler yonetim'e gitti).
    set $api http://tasarla-api:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Dosyalar sürümlü ad taşımıyor: her açılışta ETag ile doğrulanır (yayından sonra eski js kalmaz)
    add_header Cache-Control "no-cache" always;
    location = /version.json { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; }

    # nginx:alpine mime.types'ta .webmanifest yok (application/octet-stream gidiyordu)
    location = /manifest.webmanifest { types { } default_type application/manifest+json; }

    # Önizleme görselleri: Django yazar (paylaşılan birim), nginx doğrudan verir
    location /api/medya/ {
        alias /srv/medya/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $istemci_ip;
        proxy_set_header X-Forwarded-Proto $ozgun_proto;
        proxy_read_timeout 30s;
        client_max_body_size 4m;
    }

    # Bağlantı önizlemesi (Open Graph, 0.1.4): index.html <head>'inde SSI ile `?t=<kod>` varsa
    # tasarımın meta etiketleri api'den alınır (galeri/meta.py), yoksa dosyadaki varsayılanlar kalır.
    # SSI yalnız bu konumda ve yalnız text/html'de çalışır; js/styles/vendor işlenmez.
    location / {
        ssi on;
        ssi_silent_errors on;      # alt istek başarısızsa sayfaya hata metni yazılmaz
        ssi_last_modified on;      # Last-Modified korunur: no-cache doğrulaması 304 dönebilsin
        try_files $uri $uri/ /index.html;
    }

    # Yalnız SSI alt isteği (internal): dışarıdan çağrılamaz. api yoksa / yavaşsa / hata verirse
    # boş döner; sayfa yine açılır, yalnız paylaşım kartında tasarıma özgü etiketler olmaz.
    location = /_paylasim-meta {
        internal;
        proxy_pass $api/api/paylasim-meta/$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $istemci_ip;
        proxy_set_header X-Forwarded-Proto $ozgun_proto;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 400 403 404 405 500 502 503 504 = @paylasim_meta_bos;
    }
    location @paylasim_meta_bos { return 204; }
    # Yanlış adrese 200 + index.html dönmesin (tarus-standartlar: statik dosya doğrulaması)
    location ~ ^/(js|styles|public|vendor)/ { try_files $uri =404; }
}
