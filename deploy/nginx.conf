# tasarla.tarus.tr — statik dosyalar. Pusula'ya istekler tarayıcıdan gider
# (CORS: pusula Backend settings EKOSISTEM_ORIGINS), burada vekil yok.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Dosyalar sürümlü ad taşımıyor: her açılışta ETag ile doğrulanır (yayından sonra eski js kalmaz)
    add_header Cache-Control "no-cache" always;
    location = /version.json { add_header Cache-Control "no-store" always; add_header X-Content-Type-Options nosniff always; }

    # nginx:alpine mime.types'ta .webmanifest yok (application/octet-stream gidiyordu)
    location = /manifest.webmanifest { types { } default_type application/manifest+json; }

    location / {
        try_files $uri $uri/ /index.html;
    }
    # Yanlış adrese 200 + index.html dönmesin (tarus-standartlar: statik dosya doğrulaması)
    location ~ ^/(js|styles|public|vendor)/ { try_files $uri =404; }
}
